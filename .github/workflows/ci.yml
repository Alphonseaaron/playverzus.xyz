name: PlayVerzus CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck Workspaces
        run: pnpm typecheck

      - name: Lint Codebase
        run: pnpm lint

      - name: Run Unit Tests
        run: pnpm test

      - name: Build Monorepo Artifacts
        run: pnpm build
